<svg width="200" height="80" viewBox="0 0 200 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="blueGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00BFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0066CC;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="80" fill="#000000"/>
  
  <!-- 3D Cube with Checkmark -->
  <g transform="translate(120, 20)">
    <!-- Cube faces -->
    <path d="M0,0 L20,0 L25,5 L5,5 Z" fill="url(#blueGradient)" stroke="url(#blueGradient)" stroke-width="1"/>
    <path d="M20,0 L25,5 L25,25 L20,20 Z" fill="url(#blueGradient)" fill-opacity="0.7"/>
    <path d="M0,0 L5,5 L5,25 L0,20 Z" fill="url(#blueGradient)" fill-opacity="0.5"/>
    
    <!-- Checkmark on top face -->
    <path d="M6,8 L10,12 L18,4" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  
  <!-- Triddo Text -->
  <text x="10" y="35" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="url(#blueGradient)">Triddo</text>
  
  <!-- Tagline -->
  <text x="10" y="55" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="url(#blueGradient)" text-transform="uppercase">PRINT AND DESIGN 3D</text>
</svg>
